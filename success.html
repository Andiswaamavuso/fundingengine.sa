
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funding Engine | Submission Successful</title>

   <link rel="icon" type="image/png" href="./img/Funding_Engine_Favicon-removebg-preview.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfaf0;
      color: #ab875f;
      padding: 20px;
    }

    .success-container {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 55px 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
      animation: fadeIn 0.7s ease-out;
    }

    .checkmark-circle {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #fdfaf0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.6s ease-out;
    }

    .checkmark {
      width: 52px;
      height: 52px;
      stroke: #ab875f;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .checkmark-path {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawTick 0.6s ease-out 0.4s forwards;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 16px;
      color: #ab875f;
      font-weight: 700;
    }

    .message {
      font-size: 15px;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 32px;
    }

    .home-button {
      display: inline-block;
      padding: 15px 30px;
      background: #ab875f;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid #ab875f;
      border-radius: 8px;
      transition: background 0.25s ease,
                  transform 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .home-button:hover {
      background: #ffffff;
      color: #ab875f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(21, 128, 61, 0.2);
    }

    .home-button:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 4px;
    }

    @keyframes drawTick {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      70% {
        transform: scale(1.12);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .success-container {
        padding: 40px 24px;
      }

      h1 {
        font-size: 29px;
      }

      .message {
        font-size: 16px;
      }

      .home-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .checkmark-path {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>

  <main class="success-container">

    <div class="checkmark-circle" role="img"
         aria-label="Success">
      <svg class="checkmark" viewBox="0 0 52 52"
           aria-hidden="true">
        <path class="checkmark-path"
              d="M10 27 L21 38 L43 14" />
      </svg>
    </div>

    <h1>Success!</h1>

    <p class="message">
      Your submission has been received successfully.
      Thank you for getting in touch. Our team will be
      in touch with you soon.
    </p>

    <a href="https://www.fundingengine.co.za/"
       class="home-button">
      Back to Homepage
    </a>

  </main>

</body>
</html>
